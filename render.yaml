services:
  - type: web
    name: levelup-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    # IMPORTANT: the backend stores all data in SQLite (DATABASE_PATH). Render's
    # filesystem is ephemeral, so without a persistent disk every deploy/restart
    # wipes users, reviews and subscriptions. Attach a Render Disk (paid plans) and
    # point DATABASE_PATH at it, e.g. DATABASE_PATH=/var/data/levelup.sqlite.
    # Set secrets (ADMIN_EMAIL, EMAIL_*, TELEGRAM_*, PAYMENT_*) in the Render
    # dashboard, never in this file.
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TRUST_PROXY_HOPS
        value: "1"
